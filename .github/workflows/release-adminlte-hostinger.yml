name: Package verified Service Desk release
on:
  workflow_run:
    workflows: ["Laravel MySQL CI"]
    types: [completed]
permissions:
  contents: write
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Package tested commit
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/package-hostinger.sh "$REVISION"
      - name: Publish versioned ZIP and SHA-256 checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          short="${REVISION:0:12}"
          name="PlantCore_Service_Desk_$short.zip"
          gh release create "service-desk-$short" "$name" "$name.sha256" \
            --title "Service Desk · $short" \
            --notes "Tested CI revision: $REVISION. This ZIP does not include vendor, .env, runtime databases or production storage. Preserve production data and configuration. The package is source-controlled and must be validated against the target environment before use."
