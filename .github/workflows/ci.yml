name: Laravel MySQL CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plantcore_service_desk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, xml, ctype, curl, fileinfo, tokenizer
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check platform compatibility
        run: composer check-platform-reqs
      - name: Check PHP syntax
        run: find app database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Validate deployment script syntax
        run: bash -n deploy/deploy-hostinger.sh
      - name: Validate deployment guard without environment file
        run: |
          if bash deploy/deploy-hostinger.sh; then
            echo 'Expected preflight to refuse missing private configuration'
            exit 1
          fi
      - name: Check production MySQL preflight without writing data
        env:
          APP_ENV: production
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_DATABASE: plantcore_service_desk_test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          cp .env.example .env
          PHP_BIN="$(command -v php)" EXPECTED_DB_DATABASE=plantcore_service_desk_test bash deploy/deploy-hostinger.sh
      - name: Check Hostinger release archive
        run: |
          bash -n scripts/package-hostinger.sh
          bash scripts/package-hostinger.sh "$GITHUB_SHA"
          sha256sum -c "PlantCore_Service_Desk_${GITHUB_SHA:0:12}.zip.sha256"
      - name: Exercise guarded transfer on disposable SQLite and MySQL
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_URL: ''
          DB_DATABASE: database/database.sqlite
          MIGRATION_DB_HOST: 127.0.0.1
          MIGRATION_DB_PORT: '3306'
          MIGRATION_DB_NAME: plantcore_service_desk_test
          MIGRATION_EXPECTED_DATABASE: plantcore_service_desk_test
          MIGRATION_DB_USER: root
          MIGRATION_DB_PASSWORD: root
          MIGRATION_BACKUP_CONFIRMED: 'yes'
          MIGRATION_ALLOW_WRITE: 'yes'
        run: |
          php -l scripts/sqlite-to-mysql.php
          touch database/database.sqlite
          php artisan migrate --database=sqlite --force
          php artisan db:seed --database=sqlite --class=DatabaseSeeder --force
          php scripts/sqlite-to-mysql.php check
          php scripts/sqlite-to-mysql.php prepare
          php scripts/sqlite-to-mysql.php copy
          php scripts/sqlite-to-mysql.php verify
      - name: Run feature tests on MySQL
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: plantcore_service_desk_test
          DB_USERNAME: root
          DB_PASSWORD: root
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: vendor/bin/phpunit
