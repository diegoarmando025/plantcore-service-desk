name: Build AdminLTE local assets
on:
  push:
    branches: [feature/adminlte-service-desk]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Copy self-hosted assets for private and public deployment
        run: |
          set -eux
          mkdir -p public/assets/vendor/fonts deploy/hostinger-public/assets/vendor/fonts
          cp node_modules/admin-lte/dist/css/adminlte.min.css public/assets/vendor/adminlte.min.css
          cp node_modules/admin-lte/dist/js/adminlte.min.js public/assets/vendor/adminlte.min.js
          cp node_modules/bootstrap/dist/css/bootstrap.min.css public/assets/vendor/bootstrap.min.css
          cp node_modules/bootstrap/dist/js/bootstrap.bundle.min.js public/assets/vendor/bootstrap.bundle.min.js
          cp node_modules/bootstrap-icons/font/bootstrap-icons.css public/assets/vendor/bootstrap-icons.css
          cp node_modules/bootstrap-icons/font/fonts/bootstrap-icons.woff public/assets/vendor/fonts/
          cp node_modules/bootstrap-icons/font/fonts/bootstrap-icons.woff2 public/assets/vendor/fonts/
          cp public/assets/adminlte-overrides.css deploy/hostinger-public/assets/adminlte-overrides.css
          cp -R public/assets/vendor/. deploy/hostinger-public/assets/vendor/
      - name: Commit build outputs to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/assets/vendor public/assets/adminlte-overrides.css deploy/hostinger-public/assets
          if ! git diff --cached --quiet; then
            git commit -m "build: vendor AdminLTE 4 assets for offline Hostinger deployment"
            git push origin HEAD:refs/heads/feature/adminlte-service-desk
          fi
