name: Prepare PHP 8.3 dependency lock
on:
  push:
    branches: [fix/laravel12-php83-hostinger]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, xml, ctype, curl, fileinfo, tokenizer
          coverage: none
      - name: Resolve dependency lock without installation
        run: composer update --no-install --no-interaction --prefer-dist --no-progress
      - name: Commit lockfile once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Laravel 12 dependencies for PHP 8.3"
            git push origin HEAD:refs/heads/fix/laravel12-php83-hostinger
          fi
